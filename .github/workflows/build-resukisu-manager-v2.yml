name: Build ReSukiSU Manager 34681 v2

on:
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BakaSU at the kernel-34681 commit
        uses: actions/checkout@v4
        with:
          repository: Baka-SU/BakaSU
          ref: 575ea1a164a8ee925c789fdd806e9dd383babeeb
          fetch-depth: 0

      - name: Show derived version and SDK
        run: |
          cd manager
          CNT=$(git rev-list --count HEAD)
          echo "commit count = $CNT"
          echo "expected versionCode = $((30000 + CNT + 700))"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: manager
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-manager-34681-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
